<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" role="img" aria-label="Under runc the container shares the host kernel, whose Yama policy refuses a ptrace attach from the workload to the agent. Under Kata the microVM's guest kernel has no Yama, and the same attach succeeds. A one-line fix in the agent closes it under all three runtimes.">
  <defs>
    <marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52514e"/>
    </marker>
    <marker id="head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#eb6834"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#fcfcfb"/>

  <text x="30" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">Same flags, same attack, different kernel</text>
  <text x="30" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e">PTRACE_ATTACH from the workload onto the in-sandbox agent, both running as root inside a hardened container</text>

  <!-- ============ LEFT: runc ============ -->
  <text x="30" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">runc: the container shares the host kernel</text>

  <rect x="30" y="98" width="340" height="262" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1"/>
  <text x="40" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#898781">host machine</text>

  <rect x="50" y="126" width="300" height="126" rx="4" fill="none" stroke="#52514e" stroke-width="1"/>
  <text x="60" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e">container · CapDrop ALL, read-only root, no network</text>

  <rect x="64" y="178" width="88" height="40" rx="3" fill="#f0efec"/>
  <text x="108" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">workload · root</text>
  <rect x="248" y="178" width="88" height="40" rx="3" fill="#f0efec"/>
  <text x="292" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">agent · root</text>

  <text x="200" y="171" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle">PTRACE_ATTACH</text>
  <line x1="152" y1="198" x2="246" y2="198" stroke="#52514e" stroke-width="2" marker-end="url(#head-ink)"/>
  <line x1="193" y1="191" x2="207" y2="205" stroke="#0b0b0b" stroke-width="2.5"/>
  <line x1="207" y1="191" x2="193" y2="205" stroke="#0b0b0b" stroke-width="2.5"/>
  <text x="200" y="238" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle">denied</text>

  <rect x="50" y="268" width="300" height="44" rx="4" fill="#2a78d6"/>
  <text x="200" y="287" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">host Linux kernel</text>
  <text x="200" y="303" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Yama ptrace_scope = 1 refuses the attach</text>

  <text x="200" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle">the protection was never in the container's flags</text>

  <!-- ============ RIGHT: Kata ============ -->
  <text x="410" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Kata: the microVM brings its own kernel</text>

  <rect x="410" y="98" width="340" height="262" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1"/>
  <text x="420" y="114" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#898781">host machine</text>

  <rect x="422" y="120" width="316" height="192" rx="4" fill="none" stroke="#52514e" stroke-width="1"/>
  <text x="432" y="136" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e">microVM (QEMU)</text>

  <rect x="438" y="144" width="284" height="106" rx="4" fill="none" stroke="#52514e" stroke-width="1"/>
  <text x="448" y="160" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e">container · the same flags</text>

  <rect x="452" y="180" width="88" height="40" rx="3" fill="#f0efec"/>
  <text x="496" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">workload · root</text>
  <rect x="620" y="180" width="88" height="40" rx="3" fill="#f0efec"/>
  <text x="664" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="middle">agent · root</text>

  <text x="580" y="174" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle">PTRACE_ATTACH</text>
  <line x1="540" y1="200" x2="618" y2="200" stroke="#eb6834" stroke-width="2.5" marker-end="url(#head-orange)"/>
  <text x="580" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">succeeds: same uid, no capability needed</text>

  <rect x="438" y="260" width="284" height="42" rx="4" fill="#f0efec" stroke="#c3c2b7" stroke-width="1"/>
  <text x="580" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">guest Linux kernel</text>
  <text x="580" y="293" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52514e" text-anchor="middle">no Yama: nothing refuses the attach</text>

  <rect x="422" y="322" width="316" height="28" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="580" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#898781" text-anchor="middle">host Linux kernel · Yama · never on this path</text>

  <!-- ============ FIX ============ -->
  <line x1="30" y1="376" x2="750" y2="376" stroke="#e1e0d9" stroke-width="1"/>
  <text x="30" y="396" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b"><tspan font-weight="600">Fix, all three runtimes:</tspan> the agent calls prctl(PR_SET_DUMPABLE, 0) at startup. The kernel's own check then refuses a tracer</text>
  <text x="30" y="411" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b">without CAP_SYS_PTRACE, which CapDrop ALL removes. 12 of 12 vectors denied under runc, gVisor and Kata.</text>
  <text x="30" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#898781">Boxed paper, Section V.G. Evidence under Kata after the fix: PTRACE_ATTACH pid=2 errno=1 yama=absent.</text>
</svg>
